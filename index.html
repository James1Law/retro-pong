<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Law's Breakout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior: none;
      /* Prevent text selection */
      -webkit-user-select: none;
      user-select: none;
      /* Prevent touch callout */
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      /* Safe area for notched phones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #gameContainer {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }

    #gameCanvas {
      border: 2px solid #00ffff;
      box-shadow: 0 0 20px #00ffff, inset 0 0 20px rgba(0, 255, 255, 0.1);
      /* Prevent canvas from being too large */
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      /* Crisp pixel rendering */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Touch action for better mobile handling */
      touch-action: none;
    }

    /* Landscape orientation hint for mobile */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      #rotateHint {
        display: flex;
      }
    }

    #rotateHint {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00ffff;
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }

    #rotateHint svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    #rotateHint .hint-text {
      text-shadow: 0 0 10px #00ffff;
    }

    /* Hide rotate hint on desktop and landscape mobile */
    @media screen and (min-width: 601px),
           screen and (orientation: landscape) {
      #rotateHint {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Rotate hint for portrait mobile -->
  <div id="rotateHint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
      <line x1="12" y1="18" x2="12" y2="18"/>
    </svg>
    <p class="hint-text">Rotate your device<br>for the best experience</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
